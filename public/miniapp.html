<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1815">
  <meta name="description" content="میز حکم چهارنفره در تلگرام. با دوستات بازی کن یا با سه ربات تمرین کن.">
  <title>میز حکم</title>
  <link rel="preload" href="/mini/salon.webp" as="image">
  <link rel="stylesheet" href="/mini/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script type="module" src="/mini/app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="brand" type="button" data-screen="lobby" aria-label="خانهٔ میز حکم">
        <span class="crest" aria-hidden="true">♠</span>
        <span>میز حکم</span>
      </button>
      <button class="avatar" id="avatar" type="button" data-screen="profile" aria-label="پروفایل">♣</button>
    </header>
    <main id="screen" class="screen" aria-busy="true">
      <div class="loading"><span aria-hidden="true">♠</span><p>در حال باز کردن تالار…</p></div>
      <noscript>برای باز کردن میز حکم، جاوااسکریپت مرورگر را فعال کن.</noscript>
    </main>
    <nav class="dock" aria-label="صفحه‌های میز حکم">
      <button type="button" data-screen="lobby" aria-current="page"><span aria-hidden="true">♠</span>تالار</button>
      <button type="button" data-screen="table"><span aria-hidden="true">▤</span>میز من</button>
      <button type="button" data-screen="rank"><span aria-hidden="true">♛</span>رتبه‌ها</button>
      <button type="button" data-screen="profile"><span aria-hidden="true">◉</span>پروفایل</button>
    </nav>
  </div>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <header class="sheet-head"><h2 id="sheet-title"></h2><button class="icon-button" type="button" data-action="close" aria-label="بستن">×</button></header>
    <div id="sheet-content" class="sheet-content"></div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
